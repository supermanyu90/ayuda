# Local PostgreSQL + PostGIS for development (port 5433 to avoid clashing with other Postgres).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ayuda-db
    environment:
      POSTGRES_USER: ayuda
      POSTGRES_PASSWORD: ayuda_local
      POSTGRES_DB: ayuda
    ports:
      - "5433:5432"
    volumes:
      - ayuda-pg:/var/lib/postgresql/data
volumes:
  ayuda-pg:
